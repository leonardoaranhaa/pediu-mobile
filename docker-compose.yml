# MySQL para desenvolvimento local do backend Pediu.
# Uso: docker compose up -d
# export DATABASE_URL='mysql://pediu:pediu@127.0.0.1:3306/pediu'

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: pediu
      MYSQL_USER: pediu
      MYSQL_PASSWORD: pediu
    ports:
      - "3306:3306"
    volumes:
      - pediu_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  pediu_mysql_data:
