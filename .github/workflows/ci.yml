name: Pediu CI

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
    branches: ["main"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - name: Bundle Expo for Android
        run: pnpm exec expo export --platform android --output-dir /tmp/pediu-export-android --max-workers 2
      - name: Bundle Expo for iOS
        run: pnpm exec expo export --platform ios --output-dir /tmp/pediu-export-ios --max-workers 2
